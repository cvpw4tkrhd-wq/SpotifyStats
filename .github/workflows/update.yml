name: Install update

# Runs when Update.zip is uploaded to the repo root (or manually from the Actions tab).
# The zip is unpacked over the repo, new plays/tags/pictures are collected, and all data files are rebuilt.
on:
  push:
    paths:
      - 'Update.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack the update
        run: |
          test -f Update.zip || { echo "Update.zip not found in the repo root"; exit 1; }
          unzip -q -o Update.zip -d /tmp/upd
          # never overwrite the live state: the collector's own files and the workflows stay as they are
          rm -rf /tmp/upd/.github /tmp/upd/data/state.json
          rm -f /tmp/upd/data/plays/[0-9][0-9][0-9][0-9]-[0-9][0-9].json
          cp -a /tmp/upd/. ./
          rm Update.zip

      - name: Collect new plays, tags and pictures
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node scripts/collect.mjs

      - name: Build data files
        run: node scripts/analyze.mjs

      - name: Save to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Install update" && git push)
